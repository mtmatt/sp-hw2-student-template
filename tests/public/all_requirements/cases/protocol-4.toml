# A refreshed token can serve several subsequent messages.
command_timeout_ms = 2000

[limits]
processes = { soft = 4, hard = 8 }
open_fds = { soft = 16, hard = 32 }
memory_kb = { soft = 65536, hard = 131072 }
cpu_seconds = { soft = 2, hard = 5 }

[[commands]]
op = "reqtok"
fifo = "tokens/first.fifo"

[[commands]]
op = "classify"
encrypt = true
data = "first encrypted event"

[[commands]]
op = "reqtok"
fifo = "tokens/second.fifo"

[[commands]]
op = "classify"
encrypt = true
data = "ERROR second encrypted event"

[[commands]]
op = "classify"
encrypt = true
data = "payload \"quotes\" and 100% symbols"

[[commands]]
op = "classify"
encrypt = false
data = "plain finish"
