# Preserve empty and spaced encrypted payloads.
command_timeout_ms = 2000

[limits]
processes = { soft = 4, hard = 8 }
open_fds = { soft = 16, hard = 32 }
memory_kb = { soft = 65536, hard = 131072 }
cpu_seconds = { soft = 2, hard = 5 }

[[commands]]
op = "reqtok"
fifo = "token.fifo"

[[commands]]
op = "classify"
encrypt = true
data = ""

[[commands]]
op = "classify"
encrypt = true
data = "  encrypted  spaces  "

[[commands]]
op = "classify"
encrypt = true
data = "error stays a log"

[[commands]]
op = "classify"
encrypt = true
data = "Error stays a log"

[[commands]]
op = "classify"
encrypt = true
data = "ERROR at the end ERROR"
