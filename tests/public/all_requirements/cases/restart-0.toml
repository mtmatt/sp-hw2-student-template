command_timeout_ms = 2000

[limits]
processes = { soft = 4, hard = 8 }
open_fds = { soft = 16, hard = 32 }
memory_kb = { soft = 65536, hard = 131072 }
cpu_seconds = { soft = 2, hard = 5 }

[[commands]]
op = "reqtok"
fifo = "before.fifo"

[[commands]]
op = "classify"
encrypt = true
data = "self-test encrypted before restart"

[[commands]]
op = "restart"

[[commands]]
op = "reqtok"
fifo = "after.fifo"

[[commands]]
op = "classify"
encrypt = true
data = "ERROR self-test encrypted after restart"
