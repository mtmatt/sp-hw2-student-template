# Recreate a response FIFO after removing it.
command_timeout_ms = 2000

[limits]
processes = { soft = 4, hard = 8 }
open_fds = { soft = 16, hard = 32 }
memory_kb = { soft = 65536, hard = 131072 }
cpu_seconds = { soft = 2, hard = 5 }

[[commands]]
op = "reqtok"
fifo = "reuse.fifo"

[[commands]]
op = "reqtok"
fifo = "reuse.fifo"

[[commands]]
op = "reqtok"
fifo = "reuse.fifo"
