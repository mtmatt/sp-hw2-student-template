# Command-looking text and punctuation remain payload data.
command_timeout_ms = 2000

[limits]
processes = { soft = 4, hard = 8 }
open_fds = { soft = 16, hard = 32 }
memory_kb = { soft = 65536, hard = 131072 }
cpu_seconds = { soft = 2, hard = 5 }

[[commands]]
op = "classify"
encrypt = false
data = "restart"

[[commands]]
op = "classify"
encrypt = false
data = "reqtok reply.fifo"

[[commands]]
op = "classify"
encrypt = false
data = "quotes: \"hello\"; path=/tmp/events; percent=100%"

[[commands]]
op = "classify"
encrypt = false
data = "classify true ordinary text"
