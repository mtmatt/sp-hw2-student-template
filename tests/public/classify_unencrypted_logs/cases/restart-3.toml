# Several messages across multiple cleanup cycles.
command_timeout_ms = 2000

[limits]
processes = { soft = 4, hard = 8 }
open_fds = { soft = 16, hard = 32 }
memory_kb = { soft = 65536, hard = 131072 }
cpu_seconds = { soft = 2, hard = 5 }

[[commands]]
op = "classify"
encrypt = false
data = "cycle one first"

[[commands]]
op = "classify"
encrypt = false
data = "cycle one second"

[[commands]]
op = "restart"

[[commands]]
op = "classify"
encrypt = false
data = "cycle two first"

[[commands]]
op = "classify"
encrypt = false
data = "cycle two second"

[[commands]]
op = "restart"

[[commands]]
op = "classify"
encrypt = false
data = "cycle three"
